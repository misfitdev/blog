---
layout: default
---

<div class="tag-header">
  <h1>Posts in "{{ page.tag }}"</h1>
  <p class="tag-count">{{ site.categories[page.tag] | size }} posts</p>
</div>

<div class="posts">
  {% for post in site.categories[page.tag] %}
    <article class="post-card">
      <h2 class="post-title"><a href="{{ site.baseurl }}{{ post.url }}">{{ post.title }}</a></h2>

      <time class="post-date" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: "%B %d, %Y" }}</time>

      <div class="post-excerpt">
        {{ post.excerpt }}
      </div>

      <a href="{{ site.baseurl }}{{ post.url }}" class="read-more">Read More</a>
    </article>
  {% endfor %}
</div>

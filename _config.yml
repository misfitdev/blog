name: Misfit Development
description: Writing Stuff and Doing Things
avatar: https://gravatar.com/userimage/239597098/d8a6f462dcc638970435a44f4b662aa5.jpeg
url: https://misfit.dev
baseurl: ""

permalink: /:title/

kramdown:
  input: GFM
  syntax_highlighter: rouge
  toc_levels: 2..3

plugins:
  - jekyll-toc

toc:
  min_level: 2
  max_level: 3
  ordered_list: false
  no_toc_section_class: no_toc
  list_id: toc
  list_class: toc
  sublist_class: ''
  item_class: toc-entry
  item_prefix: toc-
